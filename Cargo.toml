[package]
name = "vulpecula"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
bollard = "0.21.0"
bytes = "1.12.1"
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = ["migrate", "sqlite"] }
sysinfo = "0.38.4"
tokio = { version = "1.53.0", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
validator = "0.20.0"
